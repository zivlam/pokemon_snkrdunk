name: SNKRDUNK Real-time Tracker

# Trigger Conditions
on:
  schedule:
    # cron syntax: minute hour day month day-of-week (UTC time)
    # */360 * * * * means run every 6 hours
    - cron: '*/360 * * * *'
  
  # Allows us to manually trigger the workflow from the GitHub webpage for testing
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest # Use a free Linux virtual machine

    steps:
    # 1. Checkout the repository code (Upgraded to v4, supports Node.js 24)
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Python environment (Upgraded to v5, supports Node.js 24)
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9' 

    # 3. Install required scraper packages
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests firebase-admin urllib3

    # 4. Recreate the Firebase JSON file from the vault so Python can read it
    - name: Create Firebase Key File
      env:
        FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        echo "$FIREBASE_KEY" > serviceAccountKey.json

    # 5. Run the scraper script! (Injects the Cookie into environment variables)
    - name: Run Scraper
      env:
        SNKRDUNK_COOKIE: ${{ secrets.SNKRDUNK_COOKIE }}
      run: python snkrdunk_backend.py
